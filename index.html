<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="description" content="A private return tracker and dashboard for Discipline by Design by Nathan Hansen.">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<title>Discipline by Design Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discipline">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-kicker">DISCIPLINE <span>by Design</span></div>
    <h1 id="appTitle">Dashboard</h1>
    <p id="appSub" class="sub"></p>
  </div>
  <span id="saveState" class="save-state" aria-live="polite"></span>
</header>
<div id="exampleBanner" class="example-banner" hidden>
  <strong>EXAMPLE DATA:</strong> Maya, the composite baker from Chapter 13. Her entries show how the dashboard works. Your own entries are kept separately and are not changed.
  <button type="button" class="btn small light" data-action="clearExample">Clear example</button>
</div>
<div id="backupBanner" class="backup-banner" role="status" hidden>
  <span>It's been a while since your last backup. Export a copy so you don't lose your progress.</span>
  <span class="btn-row"><button type="button" class="btn small gold-dark" data-action="export">Export now</button><button type="button" class="btn small light" data-action="snoozeBackup">Remind me later</button></span>
</div>
<div class="layout">
  <nav class="side" id="sideNav" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="bottom" id="bottomNav" aria-label="Sections"></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="logic.js"></script>
<script src="maya.js"></script>
<script src="app.js"></script>
</body>
</html>
